name: sprawl_run
description: "SPRAWL//RUN — a gamified cyberpunk running tracker. Offline story missions, GPS tracking, achievements, streaks."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.12.2

dependencies:
  audio_session: ^0.2.4
  file_selector: ^1.1.0
  file_selector_android: ^0.5.2+9
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/missions/
    - assets/sfx/

  fonts:
    # Display face — signage, headers, the "chrome" of the UI.
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron.ttf
    # Interface face — condensed, high-density, readable at a jog.
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    # Terminal face — numbers, telemetry, anything that should look like a readout.
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
