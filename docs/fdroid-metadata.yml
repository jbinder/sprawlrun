# Draft metadata for F-Droid.
#
# This file does NOT belong in this repository as far as F-Droid is concerned —
# it is kept here for reference. To submit, copy it to
#
#     metadata/io.github.jbinder.sprawlrun.yml
#
# in a fork of https://gitlab.com/fdroid/fdroiddata and open a merge request.
#
# Modelled on fdroiddata's own templates/build-flutter.yml, srclib variant.
#
# The grouping and blank lines below are for humans. fdroiddata requires
# canonical formatting — a fixed field order, `ndk` last, and no blank lines
# inside a build entry — enforced in CI by `fdroid rewritemeta`. So stripping
# the comments is NOT enough; the result must be run through rewritemeta or the
# pipeline fails on formatting alone. Do not hand-maintain the canonical order
# here; let the tool do it:
#
#     grep -v '^[[:space:]]*#' docs/fdroid-metadata.yml | cat -s | sed '/./,$!d' \
#       > $FDROIDDATA/metadata/io.github.jbinder.sprawlrun.yml
#     cd $FDROIDDATA && fdroid rewritemeta io.github.jbinder.sprawlrun
#     fdroid lint io.github.jbinder.sprawlrun
#
# fdroidserver is pip-installable into a venv if it is not packaged for your
# distro, which is enough for rewritemeta and lint (not for `fdroid build`).
# Install it from git master, not PyPI — CI runs master and has checks releases
# lack — and pin `ruamel.yaml==0.18.10` to match Debian trixie. fdroidserver
# never sets ruamel's `width`, so a newer ruamel wraps long values such as
# UpdateCheckData at 80 columns and CI rejects the formatting. Every version
# skew here has cost a CI round.
#
# NEVER let a build step contain a colon followed by a space. That makes the
# step an ambiguous YAML scalar, rewritemeta turns it into `{...}`, and the
# build dies with a bash syntax error. Where a regex needs one, write `:\ `
# (backslash-space) as the template does — sed reads it as a literal space.

