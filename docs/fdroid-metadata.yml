# Draft metadata for F-Droid.
#
# This file does NOT belong in this repository as far as F-Droid is concerned —
# it is kept here for reference. To submit, copy it to
#
#     metadata/io.github.jbinder.sprawlrun.yml
#
# in a fork of https://gitlab.com/fdroid/fdroiddata and open a merge request.
# Strip every comment before submitting: fdroiddata asks for clean files.
#
# Modelled on fdroiddata's own templates/build-flutter.yml, srclib variant.
#
# Verify locally before submitting:
#     fdroid readmeta && fdroid lint io.github.jbinder.sprawlrun
#     fdroid build io.github.jbinder.sprawlrun            # needs their buildserver

Categories:
  - Sports & Health
License: MIT
AuthorName: jbinder
SourceCode: https://github.com/jbinder/sprawlrun
IssueTracker: https://github.com/jbinder/sprawlrun/issues
Changelog: https://github.com/jbinder/sprawlrun/releases

AutoName: SPRAWL//RUN

RepoType: git
Repo: https://github.com/jbinder/sprawlrun.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0

    # Flutter is pulled in as a srclib rather than a submodule, so nothing has
    # to change in the app repo. The @ref is checked out for us — srclibs/
    # flutter.yml carries no version list, it just points at the Flutter git
    # repo, so any upstream tag is valid here.
    srclibs:
      - flutter@3.44.8

    # Where flutter leaves the unsigned APK. Repo-root relative: there is no
    # `subdir`, because the Gradle project is driven by the flutter tool rather
    # than built directly.
    output: build/app/outputs/flutter-apk/app-release.apk

    # package:jni (via path_provider_android) compiles dartjni.c through CMake.
    # 28.2.13676358 is NDK r28c; both spellings appear in fdroiddata and this
    # exact numeric version is already used by other apps, so it is available
    # on the buildserver.
    ndk: 28.2.13676358

    # Only Android is shipped; the iOS scaffolding is dead weight for a build
    # here and its Pods metadata would only give the scanner more to chew on.
    rm:
      - ios

    prebuild:
      # PUB_CACHE must live inside the build directory so the scanner actually
      # sees the Dart packages. Left at its default (~/.pub_cache) they are
      # invisible to it, which is grounds for rejection.
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter config --no-cli-animations
      # --enforce-lockfile pins to the committed pubspec.lock, so the resolved
      # dependency set is the one the developer tested rather than whatever is
      # newest on the day of the build.
      - $$flutter$$/bin/flutter pub get --enforce-lockfile

    # The pub cache holds prebuilt binaries that are needed to build and must
    # not ship, so it is deleted after the scan.
    #
    # scandelete ONLY — do not also add `scanignore: .pub-cache`. scanignore
    # makes the scanner skip the subtree, the scandelete then never fires, and
    # fdroidserver fails the build with "Unused scandelete path: .pub-cache".
    # That is a real CI failure this recipe already hit once. 349 apps in
    # fdroiddata use scandelete alone; exactly one uses both.
    scandelete:
      - .pub-cache

    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

    # No signing config is stripped here on purpose: with android/key.properties
    # absent — which it always is on the buildserver, being gitignored — the
    # release build type produces an unsigned APK for F-Droid to sign. Verified
    # locally; see the note at the bottom of this file.

AutoUpdateMode: Version
UpdateCheckMode: Tags
# A Flutter app's versionCode lives in pubspec.yaml, not in build.gradle.kts
# (which reads flutter.versionCode), so the updater has to be pointed at it.
# Both paths are spelled out rather than using the template's "." shorthand,
# matching what other Flutter apps in fdroiddata actually carry. Verified
# against this repo's pubspec.yaml: yields 0.2.0 and 2.
UpdateCheckData: pubspec.yaml|version:\s+.*\+([0-9]+)|pubspec.yaml|version:\s+([0-9.]+)
CurrentVersion: 0.2.0
CurrentVersionCode: 2

# ---------------------------------------------------------------------------
# Notes for the reviewer, worth pasting into the merge request description
# ---------------------------------------------------------------------------
#
# Google Play Services:
#   geolocator_android declares com.google.android.gms:play-services-location.
#   The app module excludes the whole `com.google.android.gms` group from its
#   configurations (android/app/build.gradle.kts), and sets
#   forceLocationManager: true so the AOSP LocationManager is used directly.
#   geolocator supports this explicitly — its client selection catches
#   NoClassDefFoundError with the comment "This might happen when the GMS
#   package has been excluded by the app developer due to its proprietary
#   license".
#
#   Verified on the 0.2.0 release APK: 1918 classes defined in the dex, zero
#   under com/google. The scanner may still flag the declaration in the
#   transitive pub dependency; the exclusion is what makes it moot at build time.
#
# Network:
#   No INTERNET permission. The merged manifest carries two permissions the app
#   does not request directly:
#     - ACCESS_NETWORK_STATE, merged in by ExoPlayer via just_audio. Reads
#       connectivity status; grants no network access.
#     - io.github.jbinder.sprawlrun.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION,
#       self-defined by share_plus so only this app can receive its own
#       share-result broadcast.
#   Without INTERNET, nothing here can reach the network regardless.
#
# Backup and restore:
#   share_plus and file_selector are used for the export/import feature in
#   Settings -> Data. Export hands a JSON file to the system share sheet;
#   import reads one back through the SAF document picker. No storage
#   permission is requested in either direction.
#
# Assets:
#   All sound effects and launcher icons are generated from source by scripts
#   in tool/ (tool/gen_sfx.dart, tool/gen_icons.dart). The only third-party
#   binaries are three SIL Open Font License typefaces in assets/fonts/, with
#   their licence texts alongside them.
#
# Unsigned output:
#   Verified locally by building with android/key.properties absent, as it is
#   on the buildserver: apksigner reports DOES NOT VERIFY / missing
#   META-INF/MANIFEST.MF, and the APK contains no signature blocks.
#
# APK size:
#   56 MB, universal rather than split per ABI. templates/build-flutter.yml
#   suggests --split-per-abi; that is a deliberate choice not to, to keep one
#   artifact and one versionCode. Happy to split (with VercodeOperation) if you
#   would rather.
