Repo: https://github.com/jbinder/sprawlrun.git

# One entry per ABI. The three differ only in versionCode, output and
# --target-platform; everything else is identical and must stay in step.
#
# `commit` is the full 40-character hash, never a tag or branch: a tag can be
# moved after review (this one was), a hash cannot. UpdateCheckMode is still
# Tags — that is only how new releases are discovered.
#
# The Flutter version is NOT pinned here. It is pinned in the app repo's
# .fvmrc — the same file fvm uses to select the SDK for local development —
# and extracted below, so a Flutter upgrade needs no change to this file.
# `3.44.8` resolves to tag 058e0af2c2b57e369d905a03ac9748b0ebf543c6 in
# flutter/flutter, which is also what .metadata records, so the two agree.
Builds:
  - versionName: 0.2.1
    versionCode: 31
    commit: aa11016c71865c62bd81d6b6caa670e6b068990d
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutterVersion=$(sed -n -E 's/.*"flutter":\ "(.*)"/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter config --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - GEO=$(dirname $PUB_CACHE/hosted/pub.dev/geolocator_android-*/android/build.gradle)
      - GM=$GEO/src/main/java/com/baseflow/geolocator/location/GeolocationManager.java
      - rm $GEO/src/main/java/com/baseflow/geolocator/location/FusedLocationClient.java
      - sed -i '/play-services-location/d' $GEO/build.gradle
      - sed -i '/^import com\.google\.android\.gms\./d' $GM
      - sed -i 's|return isGooglePlayServicesAvailable(context)|return new LocationManagerClient(context, locationOptions);|' $GM
      - sed -i '/new FusedLocationClient(context, locationOptions)/d' $GM
      - sed -i '/^ *[:].*new LocationManagerClient/d' $GM
      - sed -i '/private boolean isGooglePlayServicesAvailable/,/^  }$/d' $GM
      - if grep -rq 'com\.google\.android\.gms' $GEO; then echo 'GMS still referenced in geolocator_android'; exit 1; fi
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

